name: Feature Request
description: Propose a new feature, improvement, or capability for Rewordly
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement. Please describe the feature requirement clearly.
  - type: textarea
    id: summary
    attributes:
      label: Feature Summary
      description: Provide a clear summary of the proposed feature.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: Explain the problem that this feature solves.
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution
      description: Describe your proposed technical solution or user workflow.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions Considered
      description: Describe any alternative solutions or workarounds you considered.
