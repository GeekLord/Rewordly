name: CI

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore Rewordly.sln

      - name: Build solution
        run: dotnet build Rewordly.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test tests/Rewordly.Tests/Rewordly.Tests.csproj --configuration Release --no-build --verbosity normal

  cross-compile:
    name: Cross-Compile All Targets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify compilation for all runtime targets
        run: |
          for rid in linux-x64 linux-arm64 win-x64 win-arm64 osx-x64 osx-arm64; do
            echo "Checking publish for $rid..."
            dotnet publish src/Rewordly.Desktop/Rewordly.Desktop.csproj \
              -c Release \
              -r "$rid" \
              --self-contained true \
              -p:PublishSingleFile=true \
              -p:IncludeNativeLibrariesForSelfExtract=true \
              -p:EnableCompressionInSingleFile=true \
              -p:DebugType=none \
              -p:EnableWindowsTargeting=true \
              -o "pub/$rid"
          done
