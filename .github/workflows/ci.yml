name: CI

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      all_os:
        description: 'Also test on Windows and macOS (GitHub-hosted, PAID minutes)'
        type: boolean
        default: false

# Linux jobs run on AWS CodeBuild (no paid GitHub minutes). See GeekLord/tribal-rhythms docs/infra/RUNNERS.md.
permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os == 'linux' && format('codebuild-rewordly-{0}-{1}', github.run_id, github.run_attempt) || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.all_os && '["linux","windows-latest","macos-latest"]' || '["linux"]') }}

    steps:
      - name: Runner prep (AWS CodeBuild - sudo shim)
        if: runner.os == 'Linux'
        run: command -v sudo >/dev/null || { printf '#!/bin/sh\nexec "$@"\n' > /usr/local/bin/sudo; chmod +x /usr/local/bin/sudo; }; rm -f /codebuild/global.json  # CodeBuild image pins .NET 10 there
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore Rewordly.sln

      - name: Build solution
        run: dotnet build Rewordly.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test tests/Rewordly.Tests/Rewordly.Tests.csproj --configuration Release --no-build --verbosity normal

  cross-compile:
    name: Cross-Compile All Targets
    runs-on: ${{ format('codebuild-rewordly-{0}-{1}', github.run_id, github.run_attempt) }}
    steps:
      - name: Runner prep (AWS CodeBuild - sudo shim)
        if: runner.os == 'Linux'
        run: command -v sudo >/dev/null || { printf '#!/bin/sh\nexec "$@"\n' > /usr/local/bin/sudo; chmod +x /usr/local/bin/sudo; }; rm -f /codebuild/global.json  # CodeBuild image pins .NET 10 there
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify compilation for all runtime targets
        run: |
          for rid in linux-x64 linux-arm64 win-x64 win-arm64 osx-x64 osx-arm64; do
            echo "Checking publish for $rid..."
            dotnet publish src/Rewordly.Desktop/Rewordly.Desktop.csproj \
              -c Release \
              -r "$rid" \
              --self-contained true \
              -p:PublishSingleFile=true \
              -p:IncludeNativeLibrariesForSelfExtract=true \
              -p:EnableCompressionInSingleFile=true \
              -p:DebugType=none \
              -p:EnableWindowsTargeting=true \
              -o "pub/$rid"
          done
